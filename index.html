<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hogar & Obra — Guías de aplicación</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400..700;112,800..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f2;--fg:#151515;--mut:#625f5c;--card:#fff;--line:#e2e0de;--red:#d0021b;--ac:#d0021b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--fg:#f2f0ee;--mut:#a29d98;--card:#1a1a1a;--line:#2d2d2d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f0f;--fg:#f2f0ee;--mut:#a29d98;--card:#1a1a1a;--line:#2d2d2d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-stretch:112%;font-weight:900;line-height:1.05;margin:0;letter-spacing:-.01em}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
.top{background:#0d0d0d;color:#fff}
.top .w{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-stretch:112%;font-weight:900;font-size:18px;color:#fff;text-decoration:none}.logo b{color:var(--red)}
.back{color:#fff;text-decoration:none;font-weight:600;font-size:14px;opacity:.85}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card:focus-visible,.back:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.ph{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--ac)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.none{display:grid;place-items:center;color:#fff;font-stretch:112%;font-weight:900;font-size:34px;background:linear-gradient(135deg,#1d1d1d,#3a3a3a)}
.cb{padding:14px 10px 10px}.cb small{color:var(--mut);font-size:13px}
.cb h3{font-size:24px;margin:2px 0 6px}.cb p{margin:0 0 12px;color:var(--mut);font-size:15px}
.cb span{font-weight:700;color:var(--ac);font-size:15px}
.ph-hero{display:grid;gap:28px;align-items:center;padding:32px 0 8px}
@media(min-width:780px){.ph-hero{grid-template-columns:1.1fr .9fr}}
.ph-hero .ph{border-radius:28px;box-shadow:0 24px 50px -24px rgba(0,0,0,.55);max-width:460px;width:100%;justify-self:center}
.ph-hero h1{font-size:clamp(38px,7vw,64px);color:var(--ac)}
.ph-hero p{color:var(--mut);max-width:48ch;margin:14px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{border:1.5px solid var(--ac);color:var(--fg);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}
h2{font-size:clamp(26px,4.5vw,36px);margin:52px 0 20px}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 18px 64px;position:relative;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:16px;top:16px;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800}
.steps h3{font-size:18px;margin:0 0 4px;font-stretch:100%;font-weight:700}.steps p{margin:0;color:var(--mut);font-size:15px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}tr:last-child td{border:0}td:first-child{font-weight:700;width:38%}
.tips{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tip{border-left:5px solid var(--ac);background:var(--card);border-radius:4px 16px 16px 4px;padding:14px 16px}
.tip h3{font-size:17px;font-stretch:100%;font-weight:700;margin-bottom:4px}.tip p{margin:0;color:var(--mut);font-size:15px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 16px}
summary{cursor:pointer;padding:14px 0;font-weight:700}details p{margin:0 0 14px;color:var(--mut);font-size:15px}
.more{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.more a{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 6px 6px;color:inherit;text-decoration:none;font-weight:700;font-size:14px}
.more img{width:44px;height:44px;border-radius:9px;object-fit:cover}
footer{color:var(--mut);font-size:13px;text-align:center;padding:40px 20px 28px}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
.hero{background:#0d0d0d;color:#fff;padding:44px 0 48px}
.hero .w{display:grid;gap:36px;align-items:end}
@media(min-width:820px){.hero .w{grid-template-columns:1.1fr 1fr}}
.hero h1{font-size:clamp(42px,10vw,84px);max-width:8ch}
.hero p{margin:18px 0 0;max-width:40ch;color:#cfcac5;font-size:17px}
.col{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.col a{display:block;border-radius:18px;box-shadow:0 20px 30px -18px #000;transition:transform .2s}
.col a:hover{transform:translateY(-4px)}
.col a:nth-child(1){margin-bottom:0}.col a:nth-child(2){margin-bottom:34px}.col a:nth-child(3){margin-bottom:14px}
.col .ph{border-radius:18px}
.band{height:8px;background:linear-gradient(90deg,#1f9d3a 20%,#f26a0f 0 40%,#5fae1d 0 60%,#1573d1 0 80%,#d0021b 0)}
.grp{margin:48px 0 0}.grp h2{margin:0 0 4px;font-size:clamp(26px,4.5vw,36px)}.grp>p{color:var(--mut);margin:0 0 18px}
.grp .grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.grp+footer{margin-top:0}
.hero{position:relative;overflow:hidden}.hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 20% 35%,#1f9d3a66,transparent 28%),radial-gradient(circle at 78% 20%,#f26a0f66,transparent 28%),radial-gradient(circle at 70% 85%,#1573d166,transparent 28%),radial-gradient(circle at 30% 90%,#d0021b66,transparent 28%);filter:blur(30px);animation:drift 16s ease-in-out infinite alternate}
.hero .w{position:relative}
.hero h1{animation:up .8s cubic-bezier(.2,.8,.2,1) both}.hero p{animation:up .8s .15s cubic-bezier(.2,.8,.2,1) both}
.col a{animation:drop .9s cubic-bezier(.2,.9,.3,1.25) both,bob 5s ease-in-out 1.4s infinite}
.col a:nth-child(2){animation-delay:.15s,1.8s}.col a:nth-child(3){animation-delay:.3s,2.2s}
.col .ph{transition:transform .3s}.col a:hover .ph{transform:scale(1.06) rotate(-2deg)}
.band{background:linear-gradient(90deg,#1f9d3a,#f26a0f,#5fae1d,#1573d1,#d0021b,#1f9d3a);background-size:200% 100%;animation:flow 6s linear infinite}
.tick{overflow:hidden;background:#161616;color:#fff;white-space:nowrap}
.tick div{display:inline-block;padding:13px 0;animation:mq 30s linear infinite}
.tick span{font-stretch:112%;font-weight:800;font-size:18px;padding-left:22px}
.tick span::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:44px;margin-right:22px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none;transition:opacity .6s ease,transform .3s ease}
.rv.in:hover{transform:translateY(-4px)}
.grp h2::after{content:"";display:block;height:5px;width:0;background:var(--red);border-radius:3px;margin-top:8px;transition:width .8s ease}.grp.in h2::after{width:56px}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-70px) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes flow{to{background-position:-200% 0}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes drift{from{transform:translate(-4%,-3%) rotate(0)}to{transform:translate(4%,3%) rotate(14deg)}}
@media(prefers-reduced-motion:reduce){.hero::before,.hero h1,.hero p,.col a,.band,.tick div{animation:none!important}.rv{opacity:1;transform:none;transition:none}}
</style></head><body>

var S=[["Contacto con los ojos","Enjuagar con abundante agua corriente al menos 15 minutos. Retirar lentes de contacto. Si la irritación sigue, consultar a un médico."],["Contacto con la piel","Lavar con agua y jabón neutro. No usar solventes ni diluyentes sobre la piel, menos aún si hay heridas."],["Inhalación","Llevar a la persona a un lugar ventilado. Si hay mareos o desmayo, llamar a emergencias."],["Ingestión","No provocar el vómito. Acudir de inmediato a un centro de salud con el envase del producto."],["Derrames","Pequeños: dejar secar y retirar. Grandes: contener con arena o material absorbente. Evitar desagües."],["Almacenamiento y protección","Lugar fresco, seco y ventilado, lejos de niños y animales; no apilar más de 1,5 m. Usar guantes, protección ocular y ropa adecuada."]];
